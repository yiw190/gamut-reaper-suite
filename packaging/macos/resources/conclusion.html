<h3>Restart REAPER</h3>
<p>The bridge and the Gamut Chat panel start with REAPER from now on.</p>
<p>Check everything in Terminal:</p>
<pre>gamut-reaper-suite doctor</pre>
<p>Optional: <code>gamut-reaper-suite agents add codex claude kimi</code> adds those agents to the panel.
Remove with <code>gamut-reaper-suite uninstall</code>. Version @VERSION@.</p>
</body></html>
